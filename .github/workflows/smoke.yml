name: Smoke Test & Import Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
      - name: Smoke import test
        run: |
          python -c "import solarscan; from solarscan.cli import load_config; assert solarscan.__version__ == '1.0.0'; assert load_config()['dc_ac_ratio'] == 1.2"
          python -m solarscan --help
